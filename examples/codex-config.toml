# Copy the JetBrains Stdio config from Settings | Tools | MCP Server.
# Replace command, classpath, and IJ_MCP_SERVER_PORT with the values copied from your IDE.

[mcp_servers.jetbrains]
command = 'D:\APP\pycharm\PyCharm 2025.3\jbr\bin\java.exe'
args = [
  '-classpath',
  'D:\APP\pycharm\PyCharm 2025.3\plugins\mcpserver\lib\mcpserver-frontend.jar;D:\APP\pycharm\PyCharm 2025.3\lib\util-8.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.ktor.client.cio.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.ktor.client.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.ktor.network.tls.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.ktor.io.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.ktor.utils.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.kotlinx.io.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.kotlinx.serialization.core.jar;D:\APP\pycharm\PyCharm 2025.3\lib\module-intellij.libraries.kotlinx.serialization.json.jar',
